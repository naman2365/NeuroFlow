name: NeuroFlow CI & Release Builder

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to trigger a build manually with 1 click on GitHub!

jobs:
  # ==========================================================
  # JOB 1: CODE QUALITY & DART ANALYZER
  # ==========================================================
  analyze:
    name: 🔍 Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Zero Analyzer Errors
        run: flutter analyze --no-fatal-infos

  # ==========================================================
  # JOB 2: BUILD ANDROID LITE & UNIVERSAL APKs
  # ==========================================================
  build-android:
    name: 📱 Build Android APKs
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Split-ABI Lite APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info --extra-gen-snapshot-options=--strip

      - name: Upload Lite Android APK (arm64-v8a) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroFlow-Android-Lite-arm64-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  # ==========================================================
  # JOB 3: BUILD WINDOWS DESKTOP RELEASE
  # ==========================================================
  build-windows:
    name: 💻 Build Windows Workstation
    needs: analyze
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release Bundle
        run: flutter build windows --release

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroFlow-Windows-x64-Bundle
          path: build/windows/x64/runner/Release/